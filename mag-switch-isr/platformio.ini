; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = heltec-wsl-v3

extra_configs =
	variants/*/*.ini
	variants/*/*/platformio.ini

[env]
build_type = debug
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = heltec_wireless_stick_lite
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags = 
	-D VEXT_CTRL=36
	-D SCL_PIN=40
	-D SDA_PIN=41
	-D CLEAR_VU_MESHTASTIC
	-D CORE_DEBUG_LEVEL=4
	-DCVL_DEBUG_BUTTON=1
	-DCVL_DEBUG_BUTTON_MODULE=1
	;-DCVL_DEBUG_DALI_STATUS=1
	;-DCVL_DEBUG_DALI=1
	;-DCVL_DEBUG_INDICATOR_LED=1
	-DCVL_DEBUG_MAG_SWITCH_MONITOR=1
	;-DCVL_DEBUG_NTC_STATUS=1
	;-DCVL_DEBUG_NTC=1
	;-DCVL_DEBUG_THREAD_BASE=1

; Common settings for conventional (non Portduino) Arduino targets
[arduino_base]
framework = arduino
lib_deps =
	${env.lib_deps}
build_unflags =
	-std=c++11
	-std=gnu++11
build_flags = ${env.build_flags} -Os
	-std=gnu++17
build_src_filter = ${env.build_src_filter} 

; Common libs for communicating over TCP/IP networks such as MQTT
[networking_base]

; Extra TCP/IP networking libs for supported devices
[networking_extra]

[device-ui_base]
lib_deps =
	# renovate: datasource=git-refs depName=meshtastic/device-ui packageName=https://github.com/meshtastic/device-ui gitBranch=master
	https://github.com/meshtastic/device-ui/archive/1c45ebc7433acb8ba3fe96a6f7deca9c43fa54cf.zip